<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Live mirror of the dashboard's Sample Pad Assignments, for a second screen." />
    <title>Strudel — Pad Display</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="pad-display-page">
    <div class="portal-container pad-display">
      <header class="portal-header compact">
        <div class="portal-title-block">
          <span class="portal-pill-badge">PAD DISPLAY</span>
          <h1 class="portal-main-heading">Sample Pad Assignments</h1>
          <p class="portal-subheading pad-display-title" id="pad-display-title">Waiting for the dashboard…</p>
        </div>
        <div class="portal-header-actions">
          <span class="pad-display-status" id="pad-display-status">Connecting…</span>
          <button type="button" id="pad-display-fullscreen" class="portal-action-btn" title="Toggle fullscreen">⛶ Fullscreen</button>
        </div>
      </header>

      <div class="performer-pad-grid" id="pad-display-grid">
        <!-- Populated by pads.js -->
      </div>
    </div>

    <script type="module" src="/pads.js"></script>
  </body>
</html>
